<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <title>Predict Student Math Score</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1 class="brand small">Student Performance Predictor</h1>
            <nav>
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('predict_datapoint') }}">Predict</a>
            </nav>
        </div>
    </header>

    <main class="container form-panel">
        <h2>Student Exam Performance</h2>
        <p class="muted">Fill in the student profile and predict the expected Math score.</p>

        <form action="{{ url_for('predict_datapoint') }}" method="post" class="grid">
            <div class="field">
                <label>Gender</label>
                <select name="gender" required>
                    <option selected disabled value="">Select your Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="field">
                <label>Race / Ethnicity</label>
                <select name="ethnicity" required>
                    <option selected disabled value="">Select Ethnicity</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="field">
                <label>Parental Education</label>
                <select name="parental_level_of_education" required>
                    <option selected disabled value="">Select Parent Education</option>
                    <option value="associate's degree">associate's degree</option>
                    <option value="bachelor's degree">bachelor's degree</option>
                    <option value="high school">high school</option>
                    <option value="master's degree">master's degree</option>
                    <option value="some college">some college</option>
                    <option value="some high school">some high school</option>
                </select>
            </div>

            <div class="field">
                <label>Lunch Type</label>
                <select name="lunch" required>
                    <option selected disabled value="">Select Lunch Type</option>
                    <option value="free/reduced">free/reduced</option>
                    <option value="standard">standard</option>
                </select>
            </div>

            <div class="field">
                <label>Test Preparation</label>
                <select name="test_preparation_course" required>
                    <option selected disabled value="">Select Test course</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="field">
                <label>Writing Score (0-100)</label>
                <input type="number" name="writing_score" min="0" max="100" required />
            </div>

            <div class="field">
                <label>Reading Score (0-100)</label>
                <input type="number" name="reading_score" min="0" max="100" required />
            </div>

            <div class="field full">
                <button class="btn primary" type="submit">Predict Math Score</button>
            </div>
        </form>

        {% if results is defined %}
        <section class="result">
            <h3>Prediction</h3>
            <div class="score">{{ results }}</div>
            <p class="muted">Predicted Math score (rounded)</p>
        </section>
        {% endif %}
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
